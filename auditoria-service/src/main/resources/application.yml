server:
  port: 8084
spring:
  application:
    name: auditoria-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auditoria_db}
    username: ${DB_USER:freela}
    password: ${DB_PASSWORD:freela}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: auditoria-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
      ack-mode: record
freela:
  logging:
    logstash-destino: ${LOGSTASH_DESTINO:localhost:5000}
  kafka:
    topico-contrato-eventos: contrato.eventos
    topico-dlt: contrato.eventos.auditoria.DLT
    particoes-dlt: 3
    retry:
      tentativas: ${KAFKA_RETRY_TENTATIVAS:3}
      intervalo-inicial-ms: 1000
      multiplicador: 2.0
      intervalo-maximo-ms: 10000
  simulacao:
    falha-titulo: ${SIMULAR_FALHA_TITULO:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
logging:
  level:
    root: INFO
    org.apache.kafka: WARN
    br.com.freela: INFO
