server:
  port: 8081
spring:
  application:
    name: contrato-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/contrato_db}
    username: ${DB_USER:freela}
    password: ${DB_PASSWORD:freela}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true
freela:
  logging:
    logstash-destino: ${LOGSTASH_DESTINO:localhost:5000}
  kafka:
    topico-contrato-eventos: contrato.eventos
    particoes-contrato-eventos: 3
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
logging:
  level:
    root: INFO
    org.apache.kafka: WARN
    br.com.freela: INFO
    org.hibernate.SQL: INFO
